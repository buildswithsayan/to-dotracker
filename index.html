<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Minimal To-Do Tracker</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="apple-touch-icon" href="./logo.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Canvas Confetti for celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 114, 128, 0.8);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300" id="appBody">

    <!-- Top Navigation / Header -->
    <header class="sticky top-0 z-30 backdrop-blur-md bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800 px-4 lg:px-8 py-3.5 transition-colors duration-300">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            
            <!-- Logo & Title Area -->
            <div class="flex items-center space-x-3 group">
                <div class="relative w-10 h-10 rounded-xl overflow-hidden shadow-sm border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex items-center justify-center cursor-pointer transition-transform group-hover:scale-105" title="Click to upload custom logo" onclick="document.getElementById('logoUploadInput').click()">
                    <img id="headerLogoImg" src="./logo.png" alt="TaskFlow Logo" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-xs">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                </div>
                <input type="file" id="logoUploadInput" accept="image/*" class="hidden" onchange="handleLogoUpload(event)">
                
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-blue-400 dark:to-indigo-400 bg-clip-text text-transparent">TaskFlow</h1>
                        <button id="resetLogoBtn" onclick="resetCustomLogo()" class="hidden text-xs text-slate-400 hover:text-red-500 transition-colors" title="Reset to default logo">
                            <i class="fa-solid fa-rotate-left"></i>
                        </button>
                    </div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">Minimal & Eye-Catchy To-Do Tracker</p>
                </div>
            </div>

            <!-- Header Actions & Stats Pill -->
            <div class="flex items-center space-x-3">
                <!-- Progress Mini Pill -->
                <div class="hidden md:flex items-center space-x-2 bg-slate-100 dark:bg-slate-800/80 px-3 py-1.5 rounded-full text-xs font-medium">
                    <span class="text-slate-500 dark:text-slate-400">Progress:</span>
                    <span id="headerProgressText" class="text-blue-600 dark:text-blue-400 font-bold">0%</span>
                    <div class="w-16 bg-slate-200 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
                        <div id="headerProgressBar" class="bg-blue-600 dark:bg-blue-500 h-full w-0 transition-all duration-500"></div>
                    </div>
                </div>

                <!-- Theme Toggle Button -->
                <button onclick="toggleTheme()" aria-label="Toggle Theme" class="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    <i id="themeIcon" class="fa-solid fa-moon text-base"></i>
                </button>

                <!-- Quick Stats / Clear Completed -->
                <button onclick="clearCompletedTasks()" class="text-xs font-medium text-slate-500 hover:text-red-600 dark:text-slate-400 dark:hover:text-red-400 px-2.5 py-1.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/30 transition-colors">
                    Clear Done
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6 lg:py-8 flex flex-col gap-6">

        <!-- Input Card -->
        <section class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-4 lg:p-6 shadow-sm transition-all duration-300">
            <form id="taskForm" onsubmit="addTask(event)" class="space-y-4">
                <div class="relative">
                    <input type="text" id="taskInput" placeholder="What needs to be done? (Press Enter)..." autocomplete="off"
                        class="w-full bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3.5 text-sm lg:text-base focus:outline-none focus:ring-2 focus:ring-blue-500/50 dark:focus:ring-blue-400/50 transition-all text-slate-800 dark:text-slate-100 placeholder-slate-400">
                    <button type="submit" aria-label="Add Task" class="absolute right-2.5 top-2.5 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm flex items-center space-x-1.5 cursor-pointer">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span class="hidden sm:inline">Add Task</span>
                    </button>
                </div>

                <!-- Task Meta Options (Category, Priority, Due Date) -->
                <div class="flex flex-wrap items-center justify-between gap-3 pt-1 text-xs sm:text-sm">
                    <div class="flex flex-wrap items-center gap-2">
                        <!-- Category Selector -->
                        <div class="flex items-center space-x-1 bg-slate-100 dark:bg-slate-800/80 px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700/60">
                            <i class="fa-solid fa-tag text-slate-400 text-xs"></i>
                            <select id="taskCategory" class="bg-transparent border-none focus:outline-none text-slate-700 dark:text-slate-300 font-medium cursor-pointer">
                                <option value="Personal" class="dark:bg-slate-900">Personal</option>
                                <option value="Work" class="dark:bg-slate-900">Work</option>
                                <option value="Study" class="dark:bg-slate-900">Study</option>
                                <option value="Health" class="dark:bg-slate-900">Health</option>
                                <option value="Finance" class="dark:bg-slate-900">Finance</option>
                            </select>
                        </div>

                        <!-- Priority Selector -->
                        <div class="flex items-center space-x-1 bg-slate-100 dark:bg-slate-800/80 px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700/60">
                            <i class="fa-solid fa-flag text-slate-400 text-xs"></i>
                            <select id="taskPriority" class="bg-transparent border-none focus:outline-none text-slate-700 dark:text-slate-300 font-medium cursor-pointer">
                                <option value="Medium" class="dark:bg-slate-900">Medium Priority</option>
                                <option value="High" class="dark:bg-slate-900 text-red-500 font-semibold">High Priority</option>
                                <option value="Low" class="dark:bg-slate-900 text-emerald-500">Low Priority</option>
                            </select>
                        </div>
                    </div>

                    <!-- Due Date picker -->
                    <div class="flex items-center space-x-1.5 bg-slate-100 dark:bg-slate-800/80 px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700/60 text-slate-700 dark:text-slate-300">
                        <i class="fa-regular fa-calendar text-slate-400 text-xs"></i>
                        <input type="date" id="taskDueDate" class="bg-transparent border-none focus:outline-none text-xs sm:text-sm font-medium cursor-pointer">
                    </div>
                </div>
            </form>
        </section>

        <!-- Dashboard Summary & Analytics Bar -->
        <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 p-4 rounded-xl flex items-center justify-between shadow-sm">
                <div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Total Tasks</p>
                    <h3 id="statTotal" class="text-xl font-bold mt-0.5">0</h3>
                </div>
                <div class="w-9 h-9 rounded-lg bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 flex items-center justify-center">
                    <i class="fa-solid fa-list-check"></i>
                </div>
            </div>
            <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 p-4 rounded-xl flex items-center justify-between shadow-sm">
                <div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Completed</p>
                    <h3 id="statCompleted" class="text-xl font-bold mt-0.5 text-emerald-600 dark:text-emerald-400">0</h3>
                </div>
                <div class="w-9 h-9 rounded-lg bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 flex items-center justify-center">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>
            <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 p-4 rounded-xl flex items-center justify-between shadow-sm">
                <div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Pending</p>
                    <h3 id="statPending" class="text-xl font-bold mt-0.5 text-amber-600 dark:text-amber-400">0</h3>
                </div>
                <div class="w-9 h-9 rounded-lg bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 flex items-center justify-center">
                    <i class="fa-solid fa-clock"></i>
                </div>
            </div>
            <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 p-4 rounded-xl flex items-center justify-between shadow-sm">
                <div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">High Priority</p>
                    <h3 id="statHigh" class="text-xl font-bold mt-0.5 text-rose-600 dark:text-rose-400">0</h3>
                </div>
                <div class="w-9 h-9 rounded-lg bg-rose-50 dark:bg-rose-950/50 text-rose-600 dark:text-rose-400 flex items-center justify-center">
                    <i class="fa-solid fa-fire"></i>
                </div>
            </div>
        </section>

        <!-- Filters & Search Toolbar -->
        <section class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 bg-white dark:bg-slate-900 p-3 rounded-xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
            <!-- Filter Tabs -->
            <div class="flex items-center space-x-1 overflow-x-auto pb-1 sm:pb-0">
                <button onclick="setFilter('all')" id="filterBtn-all" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white transition-all whitespace-nowrap cursor-pointer">All</button>
                <button onclick="setFilter('pending')" id="filterBtn-pending" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all whitespace-nowrap cursor-pointer">Pending</button>
                <button onclick="setFilter('completed')" id="filterBtn-completed" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all whitespace-nowrap cursor-pointer">Completed</button>
            </div>

            <!-- Search & Category Filter -->
            <div class="flex items-center space-x-2">
                <div class="relative flex-1 sm:w-48">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying glass text-xs"></i>
                    </span>
                    <input type="text" id="searchInput" oninput="renderTasks()" placeholder="Search tasks..." 
                        class="w-full bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800 rounded-lg pl-9 pr-3 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-blue-500 text-slate-800 dark:text-slate-100">
                </div>
                
                <select id="categoryFilter" onchange="renderTasks()" class="bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800 rounded-lg px-2.5 py-1.5 text-xs font-medium text-slate-600 dark:text-slate-300 focus:outline-none cursor-pointer">
                    <option value="All">All Categories</option>
                    <option value="Personal">Personal</option>
                    <option value="Work">Work</option>
                    <option value="Study">Study</option>
                    <option value="Health">Health</option>
                    <option value="Finance">Finance</option>
                </select>
            </div>
        </section>

        <!-- Task List Section -->
        <section class="space-y-3">
            <div id="taskListContainer" class="space-y-2.5">
                <!-- Task items injected dynamically -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden flex flex-col items-center justify-center py-16 px-4 text-center bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
                <div class="w-16 h-16 rounded-2xl bg-blue-50 dark:bg-blue-950/50 text-blue-500 dark:text-blue-400 flex items-center justify-center text-2xl mb-4">
                    <i class="fa-solid fa-clipboard-check"></i>
                </div>
                <h3 class="font-semibold text-base mb-1">No tasks found</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 max-w-xs">You're all caught up! Add a new task above to get started on your day.</p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="mt-auto py-6 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-500 dark:text-slate-400">
        <p>TaskFlow &bull; Minimal To-Do Tracker designed for Mobile & Computer</p>
    </footer>

    <!-- App Logic Script -->
    <script>
        // State Management
        let tasks = JSON.parse(localStorage.getItem('taskflow_tasks')) || [
            { id: 1, text: 'Welcome to TaskFlow! Tap to complete', completed: true, category: 'Personal', priority: 'High', dueDate: '2026-12-31' },
            { id: 2, text: 'Organize your daily priorities easily', completed: false, category: 'Work', priority: 'Medium', dueDate: '' },
            { id: 3, text: 'Explore dark mode & custom logo options', completed: false, category: 'Study', priority: 'Low', dueDate: '' }
        ];

        let currentFilter = 'all';
        let isDarkMode = localStorage.getItem('taskflow_theme') === 'dark' || 
            (!localStorage.getItem('taskflow_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);

        // Initialize theme on load
        if (isDarkMode) {
            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').className = 'fa-solid fa-sun text-base';
        } else {
            document.documentElement.classList.remove('dark');
            document.getElementById('themeIcon').className = 'fa-solid fa-moon text-base';
        }

        // Initialize custom logo if saved
        const savedLogo = localStorage.getItem('taskflow_custom_logo');
        if (savedLogo) {
            document.getElementById('headerLogoImg').src = savedLogo;
            document.getElementById('resetLogoBtn').classList.remove('hidden');
        }

        // Set default date picker to today
        document.getElementById('taskDueDate').valueAsDate = new Date();

        // Handle Custom Logo Upload
        function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Image = e.target.result;
                    localStorage.setItem('taskflow_custom_logo', base64Image);
                    document.getElementById('headerLogoImg').src = base64Image;
                    document.getElementById('resetLogoBtn').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function resetCustomLogo() {
            localStorage.removeItem('taskflow_custom_logo');
            document.getElementById('headerLogoImg').src = './logo.png';
            document.getElementById('resetLogoBtn').classList.add('hidden');
            document.getElementById('logoUploadInput').value = '';
        }

        // Toggle Theme
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('taskflow_theme', 'dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun text-base';
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('taskflow_theme', 'light');
                document.getElementById('themeIcon').className = 'fa-solid fa-moon text-base';
            }
        }

        // Save Tasks to localStorage
        function saveTasks() {
            localStorage.setItem('taskflow_tasks', JSON.stringify(tasks));
            renderTasks();
            updateStats();
        }

        // Add Task
        function addTask(e) {
            e.preventDefault();
            const input = document.getElementById('taskInput');
            const category = document.getElementById('taskCategory').value;
            const priority = document.getElementById('taskPriority').value;
            const dueDate = document.getElementById('taskDueDate').value;

            const text = input.value.trim();
            if (!text) return;

            const newTask = {
                id: Date.now(),
                text: text,
                completed: false,
                category: category,
                priority: priority,
                dueDate: dueDate
            };

            tasks.unshift(newTask);
            input.value = '';
            saveTasks();
        }

        // Toggle Task Completion
        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    const updatedStatus = !task.completed;
                    if (updatedStatus) {
                        triggerConfetti();
                    }
                    return { ...task, completed: updatedStatus };
                }
                return task;
            });
            saveTasks();
        }

        // Delete Task
        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveTasks();
        }

        // Clear Completed Tasks
        function clearCompletedTasks() {
            tasks = tasks.filter(task => !task.completed);
            saveTasks();
        }

        // Set Filter
        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'pending', 'completed'].forEach(f => {
                const btn = document.getElementById(`filterBtn-${f}`);
                if (f === filter) {
                    btn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white transition-all whitespace-nowrap cursor-pointer';
                } else {
                    btn.className = 'px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all whitespace-nowrap cursor-pointer';
                }
            });
            renderTasks();
        }

        // Update Statistics & Progress Bar
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;
            const highPriority = tasks.filter(t => t.priority === 'High' && !t.completed).length;
            
            const progress = total === 0 ? 0 : Math.round((completed / total) * 100);

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statCompleted').innerText = completed;
            document.getElementById('statPending').innerText = pending;
            document.getElementById('statHigh').innerText = highPriority;

            document.getElementById('headerProgressText').innerText = `${progress}%`;
            document.getElementById('headerProgressBar').style.width = `${progress}%`;
        }

        // Confetti Celebration on task completion
        function triggerConfetti() {
            confetti({
                particleCount: 50,
                spread: 60,
                origin: { y: 0.8 },
                colors: ['#3b82f6', '#10b981', '#6366f1']
            });
        }

        // Render Tasks to DOM
        function renderTasks() {
            const container = document.getElementById('taskListContainer');
            const emptyState = document.getElementById('emptyState');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const categoryFilter = document.getElementById('categoryFilter').value;

            // Filter logic
            let filtered = tasks.filter(task => {
                const matchesSearch = task.text.toLowerCase().includes(searchQuery);
                const matchesCategory = categoryFilter === 'All' || task.category === categoryFilter;
                
                let matchesStatus = true;
                if (currentFilter === 'pending') matchesStatus = !task.completed;
                if (currentFilter === 'completed') matchesStatus = task.completed;

                return matchesSearch && matchesCategory && matchesStatus;
            });

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                updateStats();
                return;
            }

            emptyState.classList.add('hidden');
            
            container.innerHTML = filtered.map(task => {
                // Priority Badge Colors
                let priorityClass = 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400';
                if (task.priority === 'High') priorityClass = 'bg-rose-50 text-rose-600 dark:bg-rose-950/50 dark:text-rose-400 border border-rose-200/50 dark:border-rose-900/50';
                if (task.priority === 'Medium') priorityClass = 'bg-amber-50 text-amber-600 dark:bg-amber-950/50 dark:text-amber-400 border border-amber-200/50 dark:border-amber-900/50';
                if (task.priority === 'Low') priorityClass = 'bg-emerald-50 text-emerald-600 dark:bg-emerald-950/50 dark:text-emerald-400 border border-emerald-200/50 dark:border-emerald-900/50';

                return `
                    <div class="group bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-xl p-3.5 sm:p-4 flex items-center justify-between gap-3 shadow-sm hover:border-blue-500/30 transition-all duration-200">
                        <div class="flex items-center space-x-3.5 flex-1 min-w-0">
                            <!-- Checkbox -->
                            <button onclick="toggleTask(${task.id})" aria-label="Mark task as complete" class="w-5 h-5 rounded-md border ${task.completed ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-300 dark:border-slate-700 bg-transparent'} flex items-center justify-center transition-colors shrink-0 cursor-pointer">
                                ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                            </button>

                            <!-- Task Details -->
                            <div class="flex-1 min-w-0">
                                <p class="text-xs sm:text-sm font-medium text-slate-800 dark:text-slate-200 truncate ${task.completed ? 'line-through text-slate-400 dark:text-slate-500' : ''}">${escapeHtml(task.text)}</p>
                                
                                <div class="flex flex-wrap items-center gap-2 mt-1">
                                    <span class="text-[10px] font-medium px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">${task.category}</span>
                                    <span class="text-[10px] font-medium px-2 py-0.5 rounded ${priorityClass}">${task.priority}</span>
                                    ${task.dueDate ? `<span class="text-[10px] text-slate-400 dark:text-slate-500 flex items-center space-x-1"><i class="fa-regular fa-calendar-days text-[9px]"></i><span>${task.dueDate}</span></span>` : ''}
                                </div>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="flex items-center space-x-1 opacity-80 sm:opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="deleteTask(${task.id})" aria-label="Delete task" class="p-2 text-slate-400 hover:text-red-600 dark:hover:text-red-400 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/30 transition-colors cursor-pointer">
                                <i class="fa-regular fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            updateStats();
        }

        // Helper to escape HTML and prevent XSS
        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Initial render on load
        renderTasks();
    </script>
