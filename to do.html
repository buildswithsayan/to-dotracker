<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Minimal To-Do Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for sleek icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti for completion celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom smooth scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 114, 128, 0.8);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-full flex flex-col justify-between transition-colors duration-300">

    <!-- Header / Navbar -->
    <header class="w-full border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-check-double text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 dark:from-indigo-400 dark:to-violet-400 bg-clip-text text-transparent">TaskFlow</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Minimalist & Fluid Tracker</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- Theme Toggle Button -->
                <button id="themeToggleBtn" aria-label="Toggle Theme" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition active:scale-95">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-3xl w-full mx-auto px-4 py-6 md:py-10 flex flex-col space-y-6">

        <!-- Dashboard Summary & Progress Card -->
        <div class="bg-gradient-to-r from-indigo-600 to-violet-600 rounded-3xl p-6 text-white shadow-xl shadow-indigo-500/10 relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 relative z-10">
                <div>
                    <h2 id="greetingText" class="text-2xl font-bold">Welcome back!</h2>
                    <p class="text-indigo-100 text-sm mt-1">You have <span id="pendingCountBadge" class="font-semibold underline">0</span> tasks remaining today.</p>
                </div>
                <div class="bg-white/15 backdrop-blur-md px-4 py-3 rounded-2xl flex items-center space-x-4 border border-white/20">
                    <div class="relative w-12 h-12 flex items-center justify-center">
                        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                            <path class="text-white/20" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path id="progressCircle" class="text-white transition-all duration-500 ease-out" stroke-dasharray="0, 100" stroke-width="3" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        </svg>
                        <span id="progressPercentage" class="absolute text-xs font-bold">0%</span>
                    </div>
                    <div>
                        <div class="text-xs uppercase tracking-wider text-indigo-200 font-medium">Progress</div>
                        <div id="progressText" class="text-sm font-semibold">0 of 0 completed</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Task Input Section -->
        <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 md:p-5 shadow-sm border border-slate-200/80 dark:border-slate-800 transition">
            <form id="taskForm" class="space-y-3">
                <div class="flex items-center gap-2">
                    <div class="relative flex-grow">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-plus"></i>
                        </span>
                        <input type="text" id="taskInput" placeholder="What needs to be done today?" autocomplete="off"
                            class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/70 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 transition text-slate-800 dark:text-slate-100 placeholder-slate-400">
                    </div>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white px-5 py-3 rounded-xl font-medium text-sm transition shadow-md shadow-indigo-600/20 flex items-center gap-2 shrink-0">
                        <span>Add Task</span>
                    </button>
                </div>
                
                <!-- Additional options row -->
                <div class="flex flex-wrap items-center justify-between gap-3 pt-1 text-xs">
                    <div class="flex items-center gap-2">
                        <label class="text-slate-500 dark:text-slate-400 font-medium"><i class="fa-solid fa-flag mr-1"></i> Priority:</label>
                        <select id="prioritySelect" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="text-slate-500 dark:text-slate-400 font-medium"><i class="fa-solid fa-tag mr-1"></i> Category:</label>
                        <select id="categorySelect" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <option value="Personal">Personal</option>
                            <option value="Work">Work</option>
                            <option value="Study">Study</option>
                            <option value="Shopping">Shopping</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>

        <!-- Filters & Search Toolbar -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
            <!-- Filter Tabs -->
            <div class="flex items-center bg-slate-200/70 dark:bg-slate-900 p-1 rounded-xl border border-slate-300/50 dark:border-slate-800 self-start">
                <button data-filter="all" class="filter-btn px-4 py-1.5 rounded-lg text-xs font-semibold transition bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-sm">All</button>
                <button data-filter="active" class="filter-btn px-4 py-1.5 rounded-lg text-xs font-semibold transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Active</button>
                <button data-filter="completed" class="filter-btn px-4 py-1.5 rounded-lg text-xs font-semibold transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Completed</button>
            </div>

            <!-- Search Bar -->
            <div class="relative w-full sm:w-64">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-search text-xs"></i>
                </span>
                <input type="text" id="searchInput" placeholder="Search tasks..." 
                    class="w-full pl-9 pr-4 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-slate-800 dark:text-slate-100 placeholder-slate-400 shadow-sm">
            </div>
        </div>

        <!-- Task List Container -->
        <div class="space-y-3">
            <div id="taskList" class="space-y-2.5">
                <!-- Dynamically populated tasks go here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden flex flex-col items-center justify-center py-16 px-4 text-center bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <div class="w-16 h-16 rounded-full bg-indigo-50 dark:bg-indigo-950/50 text-indigo-500 flex items-center justify-center mb-4 text-2xl shadow-inner">
                    <i class="fa-solid fa-clipboard-list"></i>
                </div>
                <h3 class="text-base font-semibold text-slate-700 dark:text-slate-200">No tasks found</h3>
                <p class="text-xs text-slate-400 dark:text-slate-500 max-w-xs mt-1">Get started by creating a new task above or try switching your filter.</p>
            </div>
        </div>

        <!-- Bottom Actions (Clear Completed & Stats) -->
        <div class="flex items-center justify-between pt-2 pb-4 text-xs text-slate-500 dark:text-slate-400">
            <span id="taskCountSummary">0 items left</span>
            <div class="flex items-center gap-3">
                <button id="clearCompletedBtn" class="hover:text-rose-600 dark:hover:text-rose-400 transition font-medium">Clear Completed</button>
                <span>•</span>
                <button id="clearAllBtn" class="hover:text-rose-600 dark:hover:text-rose-400 transition font-medium">Clear All</button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-4 text-center text-xs text-slate-400 dark:text-slate-500 bg-white/50 dark:bg-slate-900/50 backdrop-blur-sm">
        <p>TaskFlow &bull; Designed for Speed and Simplicity</p>
    </footer>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- JavaScript Application Logic -->
    <script>
        // State Management
        let tasks = JSON.parse(localStorage.getItem('taskflow_tasks')) || [
            { id: 1, text: 'Welcome to TaskFlow! 👋', completed: false, priority: 'high', category: 'Personal', createdAt: new Date().toISOString() },
            { id: 2, text: 'Click the circle to mark complete ✨', completed: true, priority: 'medium', category: 'Study', createdAt: new Date().toISOString() },
            { id: 3, text: 'Add a new task using the input box above 🚀', completed: false, priority: 'low', category: 'Work', createdAt: new Date().toISOString() }
        ];
        
        let currentFilter = 'all';
        let searchQuery = '';

        // DOM Elements
        const taskForm = document.getElementById('taskForm');
        const taskInput = document.getElementById('taskInput');
        const prioritySelect = document.getElementById('prioritySelect');
        const categorySelect = document.getElementById('categorySelect');
        const taskList = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');
        const pendingCountBadge = document.getElementById('pendingCountBadge');
        const progressCircle = document.getElementById('progressCircle');
        const progressPercentage = document.getElementById('progressPercentage');
        const progressText = document.getElementById('progressText');
        const taskCountSummary = document.getElementById('taskCountSummary');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const searchInput = document.getElementById('searchInput');
        const clearCompletedBtn = document.getElementById('clearCompletedBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const greetingText = document.getElementById('greetingText');

        // Initialize Theme
        if (localStorage.getItem('taskflow_theme') === 'dark' || (!localStorage.getItem('taskflow_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            themeIcon.className = 'fa-solid fa-sun';
        } else {
            document.documentElement.classList.remove('dark');
            themeIcon.className = 'fa-solid fa-moon';
        }

        // Theme Toggle Handler
        themeToggleBtn.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('taskflow_theme', 'light');
                themeIcon.className = 'fa-solid fa-moon';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('taskflow_theme', 'dark');
                themeIcon.className = 'fa-solid fa-sun';
            }
        });

        // Set Greeting based on time of day
        const updateGreeting = () => {
            const hour = new Date().getHours();
            let greeting = 'Good day';
            if (hour < 12) greeting = 'Good morning';
            else if (hour < 18) greeting = 'Good afternoon';
            else greeting = 'Good evening';
            greetingText.textContent = `${greeting}!`;
        };
        updateGreeting();

        // Save Tasks to LocalStorage
        const saveTasks = () => {
            localStorage.setItem('taskflow_tasks', JSON.stringify(tasks));
        };

        // Toast Notification System
        const showToast = (message, type = 'success') => {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl text-xs font-medium shadow-lg transform translate-y-2 opacity-0 transition-all duration-300 flex items-center gap-2 ${
                type === 'success' ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900' : 'bg-rose-600 text-white'
            }`;
            
            const icon = type === 'success' ? '<i class="fa-solid fa-circle-check text-emerald-400"></i>' : '<i class="fa-solid fa-circle-exclamation"></i>';
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            // Remove toast after 3 seconds
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // Add Task Handler
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            if (!text) {
                showToast('Please enter a task description', 'error');
                return;
            }

            const newTask = {
                id: Date.now(),
                text: text,
                completed: false,
                priority: prioritySelect.value,
                category: categorySelect.value,
                createdAt: new Date().toISOString()
            };

            tasks.unshift(newTask);
            saveTasks();
            renderTasks();
            
            taskInput.value = '';
            showToast('Task added successfully!');
        });

        // Toggle Task Completion
        window.toggleTask = (id) => {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();

                if (task.completed) {
                    // Check if all tasks are completed
                    if (tasks.length > 0 && tasks.every(t => t.completed)) {
                        confetti({
                            particleCount: 100,
                            spread: 70,
                            origin: { y: 0.6 }
                        });
                        showToast('Fantastic! All tasks completed! 🎉');
                    } else {
                        showToast('Task completed! Great job.');
                    }
                }
            }
        };

        // Delete Task
        window.deleteTask = (id) => {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
            showToast('Task deleted');
        };

        // Filter buttons event listeners
        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => {
                    b.classList.remove('bg-white', 'dark:bg-slate-800', 'text-indigo-600', 'dark:text-indigo-400', 'shadow-sm');
                    b.classList.add('text-slate-600', 'dark:text-slate-400');
                });
                const target = e.currentTarget;
                target.classList.add('bg-white', 'dark:bg-slate-800', 'text-indigo-600', 'dark:text-indigo-400', 'shadow-sm');
                target.classList.remove('text-slate-600', 'dark:text-slate-400');
                
                currentFilter = target.getAttribute('data-filter');
                renderTasks();
            });
        });

        // Search input event listener
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            renderTasks();
        });

        // Clear Completed
        clearCompletedBtn.addEventListener('click', () => {
            const completedCount = tasks.filter(t => t.completed).length;
            if (completedCount === 0) {
                showToast('No completed tasks to clear', 'error');
                return;
            }
            tasks = tasks.filter(t => !t.completed);
            saveTasks();
            renderTasks();
            showToast('Cleared completed tasks');
        });

        // Clear All
        clearAllBtn.addEventListener('click', () => {
            if (tasks.length === 0) return;
            if (confirm('Are you sure you want to clear all tasks?')) {
                tasks = [];
                saveTasks();
                renderTasks();
                showToast('All tasks cleared');
            }
        });

        // Render Tasks & Update UI Statistics
        const renderTasks = () => {
            // Filter tasks
            let filtered = tasks.filter(task => {
                if (currentFilter === 'active') return !task.completed;
                if (currentFilter === 'completed') return task.completed;
                return true;
            });

            // Search filter
            if (searchQuery) {
                filtered = filtered.filter(task => task.text.toLowerCase().includes(searchQuery));
            }

            // Render list HTML
            if (filtered.length === 0) {
                taskList.innerHTML = '';
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                taskList.innerHTML = filtered.map(task => {
                    let priorityColor = 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400';
                    if (task.priority === 'high') priorityColor = 'bg-rose-50 text-rose-600 dark:bg-rose-950/50 dark:text-rose-400 border border-rose-200/50 dark:border-rose-900/50';
                    if (task.priority === 'medium') priorityColor = 'bg-amber-50 text-amber-600 dark:bg-amber-950/50 dark:text-amber-400 border border-amber-200/50 dark:border-amber-900/50';
                    if (task.priority === 'low') priorityColor = 'bg-emerald-50 text-emerald-600 dark:bg-emerald-950/50 dark:text-emerald-400 border border-emerald-200/50 dark:border-emerald-900/50';

                    return `
                        <div class="group bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200/80 dark:border-slate-800 shadow-sm hover:shadow-md transition flex items-center justify-between gap-3">
                            <div class="flex items-center gap-3.5 flex-grow min-w-0">
                                <button onclick="toggleTask(${task.id})" aria-label="Mark task" class="w-6 h-6 rounded-full border-2 ${task.completed ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-300 dark:border-slate-700 hover:border-indigo-500'} flex items-center justify-center shrink-0 transition active:scale-90">
                                    ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                                </button>
                                <div class="flex flex-col min-w-0">
                                    <span class="text-sm font-medium ${task.completed ? 'line-through text-slate-400 dark:text-slate-600' : 'text-slate-800 dark:text-slate-200'} truncate">${escapeHtml(task.text)}</span>
                                    <div class="flex items-center gap-2 mt-1">
                                        <span class="px-2 py-0.5 rounded-md text-[10px] font-semibold uppercase tracking-wider ${priorityColor}">${task.priority}</span>
                                        <span class="px-2 py-0.5 rounded-md text-[10px] font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400">${escapeHtml(task.category)}</span>
                                    </div>
                                </div>
                            </div>
                            <button onclick="deleteTask(${task.id})" aria-label="Delete task" class="text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition opacity-0 group-hover:opacity-100 shrink-0">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </div>
                    `;
                }).join('');
            }

            // Update stats
            const totalTasks = tasks.length;
            const completedTasks = tasks.filter(t => t.completed).length;
            const pendingTasks = totalTasks - completedTasks;

            pendingCountBadge.textContent = pendingTasks;
            taskCountSummary.textContent = `${pendingTasks} item${pendingTasks === 1 ? '' : 's'} left`;

            const percentage = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);
            progressPercentage.textContent = `${percentage}%`;
            progressText.textContent = `${completedTasks} of ${totalTasks} completed`;
            progressCircle.style.strokeDasharray = `${percentage}, 100`;
        };

        // Utility to escape HTML and prevent XSS
        const escapeHtml = (str) => {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        };

        // Initial render
        renderTasks();
    </script>
</body>
</html>
